[project]
name = "brit-pollen-trays"
version = "0.1.0"
description = "Aggregate and analyze BRIT pollen tray images"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "scikit-image",
    "pytesseract",
    "tqdm",
    "boto3>=1.43.123",
]

[dependency-groups]
dev = ["jupyterlab", "pytest"]

[project.scripts]
pollen-manifest = "brit_pollen_trays.manifest:main"
pollen-textract = "brit_pollen_trays.textract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brit_pollen_trays"]
